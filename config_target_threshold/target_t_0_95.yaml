experiment:
  dataset: target_t_0_95
  data_config:
    strategy: fixed
    train_path: ../data/movielens_100k/filtered_data/0/train.tsv
    test_path: ../data/movielens_100k/filtered_data/0/test.tsv
    side_information:
    - dataloader: ItemPopularityUserTolerance
      user_file: ../data/movielens_100k/users_tolerance_2.tsv
      item_file: ../data/movielens_100k/items_popularity_2.tsv
      user_group_file: ../data/movielens_100k/group_tolerance_2_to_users.json
      item_group_file: ../data/movielens_100k/group_popularity_2_to_items.json
  top_k: 50
  evaluation:
    cutoffs:  20
    simple_metrics: [ nDCGRendle2020, Recall, HR, Precision, MAP, MRR, ItemCoverage, ACLT, APLT, Gini, SEntropy, EFD, EPC, PopREO, PopRSP ]
  csv_path: ./results/target_t_0_95/performance/CR_verification.csv
  external_models_path: ../external/models/__init__.py
  models:
    # ITEM
    ItemKNN:
      meta:
        verbose: True
        save_recs: True
        validation_metric: nDCGRendle2020@20
        hyper_opt_alg: grid
      neighbors: [ 50, 100, 250]
      similarity: [ jaccard, cosine ]
      implementation: standard
    ItemANNOY:
      meta:
        verbose: True
        save_recs: True
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ angular ]
      n_trees: [ 1 ]
      search_k: [ -1 ]
    ItemANNfaissLSH:
      meta:
        verbose: True
        save_recs: True
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: cosine
      nbits: [ 32 ]
      n_tables: [ 30 ]
    ItemFairANN:
      meta:
        verbose: True
        save_recs: True
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: cosine
      sampling_strategy: [no_sampling, opt, uniform, rank, approx_degree]
      n_hash: [ 10 ]
      n_tables: [ 3 ]
    ItemKNNfairness:
      meta:
        verbose: True
        save_recs: True
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard, cosine ]
      pre_post_processing: [interactions-users, interactions-items]

    # USER
    UserKNN:
      meta:
        verbose: True
        save_recs: True
        validation_metric: nDCGRendle2020@20
        hyper_opt_alg: grid
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard, cosine ]
      implementation: standard
    UserANNOY:
      meta:
        verbose: True
        save_recs: True
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ angular ]
      n_trees: [ 1 ]
      search_k: [ -1 ]
    UserANNfaissLSH:
      meta:
        verbose: True
        save_recs: True
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: cosine
      nbits: [ 32 ]
      n_tables: [ 30 ]
    UserFairANN:
      meta:
        verbose: True
        save_recs: True
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: cosine
      sampling_strategy: [no_sampling, opt, uniform, rank, approx_degree]
      n_hash: [ 10 ]
      n_tables: [ 3 ]
    UserKNNfairness:
      meta:
        verbose: True
        save_recs: True
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard, cosine ]
      pre_post_processing: [interactions-users, interactions-items]