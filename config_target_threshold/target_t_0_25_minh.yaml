experiment:
  dataset: target_t_0_25_minh
  data_config:
    strategy: fixed
    train_path: ../data/movielens_100k/filtered_data/0/train.tsv
    test_path: ../data/movielens_100k/filtered_data/0/test.tsv
  top_k: 50
  evaluation:
    cutoffs: 20
    simple_metrics: [ nDCGRendle2020, Recall, HR, Precision, MAP, MRR, ItemCoverage, ACLT, Gini, SEntropy, EFD, EPC, PopREO, PopRSP ]
  csv_path: ./results/target_t_0_25_minh/performance/CR_verification.csv
  external_models_path: ../external/models/__init__.py
  models:
    # ITEM
    ItemFairANN:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard ]
      sampling_strategy: [ no_sampling ]
      n_hash: [ 1 ]
      n_tables: [ 4 ]

    # USER
    UserFairANN:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard ]
      sampling_strategy: [ no_sampling ]
      n_hash: [ 1 ]
      n_tables: [ 4 ]