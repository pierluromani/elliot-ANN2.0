experiment:
  dataset: target_t_0_75
  data_config:
    strategy: fixed
    train_path: ../data/movielens_100k/filtered_data/0/train.tsv
    test_path: ../data/movielens_100k/filtered_data/0/test.tsv
  top_k: 50
  evaluation:
    cutoffs:  20
    simple_metrics: [ nDCGRendle2020, EPC, Gini ]
  csv_path: ./results/target_t_0_75/performance/CR_verification.csv
  external_models_path: ../external/models/__init__.py
  models:
    # ITEM
    ItemKNN:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
        hyper_opt_alg: grid
      neighbors: [ 50, 100, 250]
      similarity: [ jaccard, cosine ]
      implementation: standard
    ItemANNOY:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ angular ]
      n_trees: [ 3 ]
      search_k: [ -1 ]
    ItemANNfaissLSH:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard, cosine ]
      nbits: [ 12 ]
      n_tables: [ 23 ]
    ItemFairANN:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard, cosine ]
      sampling_strategy: [ exact_degree, aprox_degree, opt, no_sampling ]
      n_hash: [ 12 ]
      n_tables: [ 23 ]
    ItemKNNfairness:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard, cosine ]
      pre_post_processing: interactions-items

    # USER
    UserKNN:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
        hyper_opt_alg: grid
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard, cosine ]
      implementation: standard
    UserANNOY:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ angular ]
      n_trees: [ 2 ]
      search_k: [ -1 ]
    UserANNfaissLSH:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard, cosine ]
      nbits: [ 12 ]
      n_tables: [ 23 ]
    UserFairANN:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard, cosine ]
      sampling_strategy: [ exact_degree, aprox_degree, opt, no_sampling ]
      n_hash: [ 12 ]
      n_tables: [ 23 ]
    UserKNNfairness:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard, cosine ]
      pre_post_processing: interactions-users