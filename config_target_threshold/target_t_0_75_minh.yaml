experiment:
  dataset: target_t_0_75
  data_config:
    strategy: fixed
    train_path: ../data/movielens_100k/filtered_data/0/train.tsv
    test_path: ../data/movielens_100k/filtered_data/0/test.tsv
  top_k: 50
  evaluation:
    cutoffs:  20
    simple_metrics: [ nDCGRendle2020, EPC, Gini ]
  csv_path: ./results/target_t_0_75/performance/CR_verification.csv
  external_models_path: ../external/models/__init__.py
  models:
    # ITEM
    ItemFairANN:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard ]
      sampling_strategy: [ no_sampling ]
      n_hash: [ 8 ]
      n_tables: [ 10 ]

    # USER
    UserFairANN:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard ]
      sampling_strategy: [ no_sampling ]
      n_hash: [ 8 ]
      n_tables: [ 10 ]