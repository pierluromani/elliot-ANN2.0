experiment:
  dataset: target_t_0_05
  data_config:
    strategy: fixed
    train_path: ../data/movielens_100k/filtered_data/0/train.tsv
    test_path: ../data/movielens_100k/filtered_data/0/test.tsv
    side_information:
    - dataloader: ItemPopularityUserTolerance
      user_file: ../data/movielens_100k/users_tolerance_2.tsv
      item_file: ../data/movielens_100k/items_popularity_2.tsv
      user_group_file: ../data/movielens_100k/group_tolerance_2_to_users.json
      item_group_file: ../data/movielens_100k/group_popularity_2_to_items.json
  top_k: 50
  evaluation:
    cutoffs:  20
    simple_metrics: [ nDCGRendle2020, Recall, HR, Precision, MAP, MRR, ItemCoverage, ACLT, Gini, SEntropy, EFD, EPC, PopREO, PopRSP ]
  csv_path: ./results/target_t_0_05/performance/CR_verification.csv
  external_models_path: ../external/models/__init__.py
  models:
    # ITEM
    ItemKNN:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
        hyper_opt_alg: grid
      neighbors: [ 50, 100, 250]
      similarity: [ jaccard, cosine ]
      implementation: standard
    ItemFairANN:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard, cosine ]
      sampling_strategy: [no_sampling, opt, uniform, rank, approx_degree]
      n_hash: [ 6 ]
      n_tables: [ 53 ]
    ItemANNOY:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ angular ]
      n_trees: [ 12 ]
      search_k: [ -1 ]
    ItemANNfaissLSH:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ cosine ]
      nbits: [ 4 ]
      n_tables: [ 14 ]
    ItemKNNfairness:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard, cosine ]
      pre_post_processing: [interactions-users, interactions-items]

    # USER
    UserKNN:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
        hyper_opt_alg: grid
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard, cosine ]
      implementation: standard
    UserFairANN:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard, cosine ]
      sampling_strategy: [no_sampling, opt, uniform, rank, approx_degree]
      n_hash: [ 6 ]
      n_tables: [ 53 ]
    UserANNOY:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ angular ]
      n_trees: [ 9 ]
      search_k: [ -1 ]
    UserANNfaissLSH:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ cosine ]
      nbits: [ 4 ]
      n_tables: [ 14 ]
    UserKNNfairness:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard, cosine ]
      pre_post_processing: [interactions-users, interactions-items]