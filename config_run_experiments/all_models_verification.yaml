experiment:
  dataset: movielens_100k
  data_config:
    strategy: fixed
    train_path: ../data/movielens_100k/filtered_data/0/train.tsv
    test_path: ../data/movielens_100k/filtered_data/0/test.tsv
  top_k: 50
  path_output_rec_result: ./results/movielens_100k_item/recs/
  path_output_rec_weight: ./results/movielens_100k_item/weights/
  path_output_rec_performance: ./results/movielens_100k_item/performance/
  path_log_folder: ../log/movielens_100k_item/
  evaluation:
    cutoffs:  20
    simple_metrics: [ nDCGRendle2020, EPC, Gini ]
  csv_path: ./results/movielens_100k_item/performance/CR_verification.csv
  external_models_path: ../external/models/__init__.py
  models:
    ItemKNN:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
        hyper_opt_alg: grid
      neighbors: [ 50 ]
      similarity: [ cosine, euclidean ]
      implementation: standard
    UserKNN:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
        hyper_opt_alg: grid
      neighbors: [ 50 ]
      similarity: [ cosine, euclidean ]
      implementation: standard
    ItemANNOY:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50 ]
      similarity: [ hamming ]
      n_trees: [ 10 ]
      search_k: [ -1 ]
    UserANNOY:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50 ]
      similarity: [ hamming ]
      n_trees: [ 10 ]
      search_k: [ -1 ]
    ItemANNfaissLSH:
       meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
       neighbors: [ 50 ]
       similarity: cosine
       nbits: [ 4 ]
    UserANNfaissLSH:
       meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
       neighbors: [ 50 ]
       similarity: cosine
       nbits: [ 4 ]
    ItemFairANN:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50 ]
      similarity: [ jaccard ]
      sampling_strategy: [ approx_degree ]
      n_hash: [ 4 ]
      n_tables: [ 8 ]
    UserFairANN:
      meta:
        verbose: True
        save_recs: False
        validation_metric: nDCGRendle2020@20
      neighbors: [ 50 ]
      similarity: [ jaccard ]
      sampling_strategy: [ approx_degree ]
      n_hash: [ 4 ]
      n_tables: [ 8 ]