experiment:
  dataset: target_t_0_25_minh_prova
  data_config:
    strategy: fixed
    train_path: ../data/movielens_100k/filtered_data/0/train.tsv
    test_path: ../data/movielens_100k/filtered_data/0/test.tsv
  top_k: 50
  evaluation:
    cutoffs: 20
    simple_metrics: [ nDCGRendle2020, HR, APLT, Gini, EPC, PopREO, PopRSP ]
    paired_ttest: True
  external_models_path: ../external/models/__init__.py
  models:
    RecommendationFolder:
      folder: results/target_t_0_25_minh/recs
    ItemKNN:
      meta:
        verbose: True
        save_recs: True
        validation_metric: nDCGRendle2020@20
        hyper_opt_alg: grid
      neighbors: [ 50, 100, 250]
      similarity: [ jaccard, cosine ]
      implementation: standard
    UserKNN:
      meta:
        verbose: True
        save_recs: True
        validation_metric: nDCGRendle2020@20
        hyper_opt_alg: grid
      neighbors: [ 50, 100, 250 ]
      similarity: [ jaccard, cosine ]
      implementation: standard