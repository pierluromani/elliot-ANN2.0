experiment:
  dataset: target_t_0_05_annoy
  data_config:
    strategy: fixed
    train_path: ../data/movielens_100k/filtered_data/0/train.tsv
    test_path: ../data/movielens_100k/filtered_data/0/test.tsv
    side_information:
    - dataloader: ItemPopularityUserTolerance
      user_file: ../data/movielens_100k/users_tolerance_2.tsv
      item_file: ../data/movielens_100k/items_popularity_2.tsv
      user_group_file: ../data/movielens_100k/group_tolerance_2_to_users.json
      item_group_file: ../data/movielens_100k/group_popularity_2_to_items.json
  top_k: 50
  evaluation:
    cutoffs:  20
    simple_metrics: [ nDCGRendle2020, Recall, HR, Precision, MAP, MRR, ItemCoverage, ACLT, APLT, Gini, SEntropy, EFD, EPC, PopREO, PopRSP ]
  csv_path: ./results/target_t_0_05_annoy/performance/CR_verification.csv
  external_models_path: ../external/models/__init__.py
  models:
    #----- t=0.05-----------------
    ItemANNOY:
          meta:
            verbose: True
            save_recs: True
            validation_metric: nDCGRendle2020@20
          neighbors: [ 50, 100, 250 ]
          similarity: [ angular ]
          n_trees: [ 12 ]
          search_k: [ 100, 200, 500,-1 ]

    UserANNOY:
          meta:
            verbose: True
            save_recs: True
            validation_metric: nDCGRendle2020@20
          neighbors: [ 50, 100, 250 ]
          similarity: [ angular ]
          n_trees: [ 9 ]
          search_k: [ 10, 25, 50 ,-1]