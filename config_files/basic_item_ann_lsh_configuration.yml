experiment:
  dataset: movielens_100k
  data_config:
    strategy: fixed
    train_path: ../data/movielens_100k/filtered_data/0/train.tsv
    test_path: ../data/movielens_100k/filtered_data/0/test.tsv
  top_k: 50
  path_output_rec_result: ./results/ml_100k_item_ann_lsh/recs/
  path_output_rec_weight: ./results/ml_100k_item_ann_lsh/weights/
  path_output_rec_performance: ./results/ml_100k_item_ann_lsh/performance/
  path_log_folder: ../log/ml_100k_item_ann_lsh/
  evaluation:
    cutoffs: 20
    simple_metrics: [ nDCGRendle2020 ]
  external_models_path: ../external/models/__init__.py
  models:
    ItemFairANN:
      meta:
        verbose: True
        save_recs: True
      neighbors: 50
      similarity: jaccard
      validate: False
      n_hash: 5
      n_tables: 1
      similarity_threshold: 0.5